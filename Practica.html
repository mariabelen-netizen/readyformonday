<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nina's Weekend Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }

/* Layout: a rehearsal-room workbook. A sticky route bar of stops on top; one task card at a time, next to the text it needs. */
:root {
  --bg: #F6F5FB; --surface: #FFFFFF; --ink: #1E1B3A; --muted: #5C5878;
  --brand: #210D80; --brand-ink: #210D80; --on-brand: #FFFFFF;
  --accent: #FF5C00; --accent-ink: #B83C00; --lav: #EEECF9; --line: #DCD9EE;
  --ok: #1B7A43; --okbg: #E5F3EA; --no: #A8261B; --nobg: #FCEBE8; --hl: #FFE1CC; --hl-ink: #1E1B3A;
  --font-body: "Atkinson Hyperlegible", Arial, Helvetica, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", Arial, sans-serif;
  --scale: 1; --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14122B; --surface: #1E1B3D; --ink: #EEECFA; --muted: #B6B2D6;
  --brand: #4733CF; --brand-ink: #C9C1FF; --on-brand: #FFFFFF;
  --accent: #FF6A1A; --accent-ink: #FF9A61; --lav: #29254F; --line: #3A3566;
  --ok: #6AD497; --okbg: #17392A; --no: #FF958A; --nobg: #3F1C1C; --hl: #5B3216; --hl-ink: #FFF3EA;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14122B; --surface: #1E1B3D; --ink: #EEECFA; --muted: #B6B2D6;
  --brand: #4733CF; --brand-ink: #C9C1FF; --on-brand: #FFFFFF;
  --accent: #FF6A1A; --accent-ink: #FF9A61; --lav: #29254F; --line: #3A3566;
  --ok: #6AD497; --okbg: #17392A; --no: #FF958A; --nobg: #3F1C1C; --hl: #5B3216; --hl-ink: #FFF3EA;
  color-scheme: dark }
html { font-size: calc(18px * var(--scale)); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); color: var(--brand-ink); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.12rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.top-in { max-width: 1080px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.brand b { font-family: var(--font-display); font-size: 1.05rem; color: var(--brand-ink); display: block; line-height: 1.1; }
.brand span { font-size: .78rem; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.score { display: inline-flex; align-items: center; gap: 6px; background: var(--lav); color: var(--brand-ink); font-weight: 700; padding: 6px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.score .star { color: var(--accent); }
.tbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; min-height: 40px; min-width: 40px; padding: 4px 10px; font-weight: 700; }
.route { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding-block: 2px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1080px; margin: 0 auto; scrollbar-width: thin; }
.stop { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; min-height: 40px; }
.stop .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; background: var(--lav); color: var(--brand-ink); }
.stop[aria-current="page"] { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.stop[aria-current="page"] .dot { background: var(--on-brand); color: var(--brand); }
.stop.done .dot { background: var(--ok); color: #fff; }
.stop.extra { border-style: dashed; }

@media (min-width: 900px) { .route { flex-wrap: wrap; overflow: visible; } }
main { padding-top: 22px; }
.view { display: grid; gap: 20px; }
.lead { color: var(--muted); max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.soft { background: var(--lav); border: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.split > .text { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 140px); }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } .split > .text { position: static; } }

/* profile text */
.ptext { display: grid; gap: 14px; }
.ptext .who { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.ptext .who strong { font-family: var(--font-display); font-size: 1.15rem; color: var(--brand-ink); }
.para { max-width: 62ch; }
.para .pn { font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .1em; display: block; margin-bottom: 2px; }
.sent { border-radius: 6px; padding: 1px 2px; }
.mode-sentence .sent { cursor: pointer; box-shadow: inset 0 -2px 0 var(--line); }
.mode-sentence .sent:hover { background: var(--lav); }
.w { border-radius: 5px; padding: 0 1px; }
.mode-word .para.active .w { cursor: pointer; box-shadow: inset 0 -2px 0 var(--line); }
.mode-word .para.active .w:hover { background: var(--lav); }
.mode-word .para:not(.active) { opacity: .55; }
.hl { background: var(--hl); color: var(--hl-ink); }
.miss { background: var(--nobg); }

/* task */
.task { display: grid; gap: 16px; }
.task-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.pill.brand { background: var(--brand); color: var(--on-brand); }
.pill.acc { background: var(--accent); color: #fff; }
.pill.lav { background: var(--lav); color: var(--brand-ink); }
.prompt { font-size: 1.25rem; font-weight: 700; color: var(--brand-ink); max-width: 40ch; }
.sub { color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { border: 2px solid var(--brand); background: var(--surface); color: var(--brand-ink); border-radius: 12px; padding: 10px 18px; min-height: 48px; font-weight: 700; font-size: 1.05rem; }
.opt:hover { background: var(--lav); }
.opt.right { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--nobg); border-color: var(--no); color: var(--no); }
.opt:disabled { cursor: default; }
.sentence { font-size: 1.2rem; line-height: 2.1; }
.gap { display: inline-block; font: inherit; font-weight: 700; color: var(--brand-ink); width: 9.5em; max-width: 100%; border: 0; border-bottom: 3px solid var(--accent); background: var(--lav); border-radius: 6px 6px 0 0; padding: 2px 8px; }
.gap.short { width: 5.5em; }
.gap.ok { border-bottom-color: var(--ok); background: var(--okbg); }
.gap.bad { border-bottom-color: var(--no); background: var(--nobg); }
.verb { color: var(--muted); font-weight: 400; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 10px 18px; min-height: 48px; font-weight: 700; }
.btn.main { background: var(--brand); color: var(--on-brand); }
.btn.acc { background: var(--accent); color: #fff; }
.btn.ghost { background: var(--lav); color: var(--brand-ink); }
.btn.line { background: transparent; color: var(--brand-ink); border: 2px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.fb.ok { background: var(--okbg); color: var(--ink); border-left: 0; }
.fb.ok b { color: var(--ok); }
.fb.no { background: var(--nobg); }
.fb.no b { color: var(--no); }
.fb.hint { background: var(--lav); }
.fb.hint b { color: var(--brand-ink); }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 88px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.dots i.ok { background: var(--ok); }
.stars { color: var(--accent); font-weight: 700; letter-spacing: .1em; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; padding: 10px; border-radius: 12px; }
.bank { background: var(--lav); }
.answer { border: 2px dashed var(--brand); background: var(--surface); }
.answer:empty::before { content: "Drag or tap the words here"; color: var(--muted); align-self: center; padding-left: 4px; }
.chip { border: 0; background: var(--surface); color: var(--brand-ink); border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 1.05rem; box-shadow: 0 1px 0 var(--line), 0 0 0 2px var(--line) inset; touch-action: none; min-height: 48px; }
.answer .chip { background: var(--brand); color: var(--on-brand); box-shadow: none; }
.chip.ghosting { opacity: .4; }
.qmark { font-size: 1.6rem; font-weight: 800; color: var(--accent-ink); }

/* home */
.hero { display: grid; gap: 14px; }
.hero h1 { font-size: 2.3rem; }
.ruleset { display: grid; gap: 10px; }
.rule { display: flex; gap: 12px; align-items: flex-start; }
.ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--brand); color: var(--on-brand); font-size: .9rem; }
.ico.acc { background: var(--accent); color: #fff; }
.go { display: grid; gap: 10px; align-content: start; }
.badge { display: inline-flex; align-items: center; gap: 8px; background: var(--okbg); color: var(--ok); border-radius: 999px; padding: 6px 12px; font-weight: 700; }
.badge.locked { background: var(--lav); color: var(--muted); }

/* backstage */
.fact { display: grid; gap: 12px; }
.pairs { display: grid; gap: 10px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.pair div { background: var(--lav); border-radius: 10px; padding: 10px 12px; }
.pair b { color: var(--brand-ink); }

/* traffic */
.tl { display: grid; gap: 10px; }
.tlrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tlrow span { font-weight: 700; color: var(--brand-ink); min-width: 0; flex: 1 1 260px; }
.lights { display: flex; gap: 8px; }
.light { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 700; font-size: .85rem; }
.light[aria-pressed="true"].g { background: #1F8A4C; border-color: #1F8A4C; color: #fff; }
.light[aria-pressed="true"].y { background: #F2A900; border-color: #F2A900; color: #1E1B3A; }
.light[aria-pressed="true"].r { background: #C62D1F; border-color: #C62D1F; color: #fff; }
.listen { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); color: var(--brand-ink); border-radius: 999px; padding: 4px 12px; min-height: 40px; font-weight: 700; font-size: .85rem; }
.listen[aria-pressed="true"] { border-color: var(--accent); }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); } to { transform: scale(1); } }
.fb.ok { animation: pop .2s ease-out; }
</style>
</head>
<body>


<header class="top" role="banner">
  <div class="top-in">
    <div class="brand"><img id="logo" alt="Nota20 Explicações logo"><div><b>Weekend Practice</b><span>Nota20 · Your next exchange visitor</span></div></div>
    <div class="tools">
      <span class="score" aria-live="polite" id="scoreBox"><span class="star">★</span> <span id="scoreNum">0</span></span>
      <button class="tbtn" id="fontDown" aria-label="Smaller text">A−</button>
      <button class="tbtn" id="fontUp" aria-label="Bigger text">A+</button>
      <button class="tbtn" id="themeBtn" aria-label="Change light or dark mode">Light / Dark</button>
    </div>
  </div>
  <nav class="route" id="route" aria-label="Your route"></nav>
</header>
<main class="wrap" id="app"></main>
